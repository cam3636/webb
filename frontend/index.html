<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập – Milky Tea – Trà sữa & Cà phê</title>
    <link rel="stylesheet" href="/css/site.css?v=milky-theme-4">
</head>
<body class="login-page">
    <main class="login-wrapper">
        <header class="login-brand">
            <p class="login-brand-name">Milky Tea</p>
            <p>Quản lý chuỗi trà sữa &amp; cà phê</p>
            <div class="login-art" aria-hidden="true">
                <div class="tea-straw"></div>
                <div class="tea-cup"><span>MT</span></div>
                <div class="tea-lid"></div>
            </div>
        </header>
        <section class="login-panel" aria-labelledby="loginTitle">
            <h1 id="loginTitle">Đăng nhập</h1>
            <p class="login-intro">Dùng tài khoản nhân viên để vào hệ thống.</p>
            <div id="loginMessage" class="alert hidden" role="alert"></div>

            <form id="loginForm" onsubmit="handleLoginSubmit(event)">
                <div class="form-group">
                    <label for="username">Tên đăng nhập</label>
                    <input type="text" id="username" placeholder="Nhập tên đăng nhập" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" placeholder="Nhập mật khẩu" autocomplete="current-password" required>
                </div>
                <button type="submit" id="btnLogin" class="btn btn-primary login-submit">Đăng nhập</button>
            </form>

            <div class="demo-accounts">
                <h2>Tài khoản mẫu</h2>
                <div class="demo-grid">
                    <button type="button" class="btn" onclick="fillDemoAccount('cam','cam123')">Quản trị viên <small>Toàn chuỗi</small></button>
                    <button type="button" class="btn" onclick="fillDemoAccount('barista_a','Barista@123')">Pha chế <small>Chi nhánh A</small></button>
                    <button type="button" class="btn" onclick="fillDemoAccount('manager_a','Manager@123')">Quản lý <small>Chi nhánh A</small></button>
                    <button type="button" class="btn" onclick="fillDemoAccount('manager_b','Manager@123')">Quản lý <small>Chi nhánh B</small></button>
                    <button type="button" class="btn" onclick="fillDemoAccount('cashier_a','Cashier@123')">Thu ngân <small>Chi nhánh A</small></button>
                    <button type="button" class="btn" onclick="fillDemoAccount('cashier_b','Cashier@123')">Thu ngân <small>Chi nhánh B</small></button>
                </div>
            </div>
        </section>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
